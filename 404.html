<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지를 찾을 수 없습니다 | 스마트 연차관리</title>
  <meta name="description" content="요청하신 페이지를 찾을 수 없습니다. 스마트 연차관리 시스템으로 돌아가세요." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --gray-900: #111827;
      --gray-600: #4B5563;
      --gray-400: #9CA3AF;
      --gray-200: #E5E7EB;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0f4ff 0%, #fafafa 60%, #f5f0ff 100%);
      padding: 1.5rem;
    }
    .container { text-align: center; max-width: 480px; width: 100%; animation: fadeUp 0.5s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .logo-wrap {
      width: 72px; height: 72px; border-radius: 20px; background: var(--primary);
      display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem;
      font-size: 32px; font-weight: 800; color: #fff;
      box-shadow: 0 16px 40px rgba(79, 70, 229, 0.30);
    }
    .code-badge {
      display: inline-block; background: var(--primary-light); color: var(--primary);
      font-size: 13px; font-weight: 700; letter-spacing: 0.06em; padding: 5px 14px;
      border-radius: 999px; margin-bottom: 1.25rem; border: 1px solid rgba(79,70,229,0.2);
    }
    h1 { font-size: 28px; font-weight: 800; color: var(--gray-900); margin-bottom: 0.75rem; line-height: 1.3; }
    .sub { font-size: 15px; color: var(--gray-600); line-height: 1.7; margin-bottom: 2rem; }
    .card {
      background: rgba(255,255,255,0.85); border: 1px solid var(--gray-200); border-radius: 18px;
      padding: 1.75rem 2rem; box-shadow: 0 4px 24px rgba(0,0,0,0.06); backdrop-filter: blur(12px);
      margin-bottom: 1.5rem;
    }
    .hint { font-size: 13px; color: var(--gray-600); margin-bottom: 1.25rem; text-align: left; }
    .checklist { list-style: none; display: flex; flex-direction: column; gap: 10px; text-align: left; }
    .checklist li { display: flex; align-items: flex-start; gap: 8px; font-size: 13.5px; color: var(--gray-600); line-height: 1.5; }
    .checklist li::before { content: '✦'; color: var(--primary); font-size: 11px; flex-shrink: 0; margin-top: 2px; }
    .btn-home {
      display: inline-flex; align-items: center; gap: 8px; background: var(--primary); color: #fff;
      font-size: 15px; font-weight: 600; padding: 14px 32px; border-radius: 12px;
      text-decoration: none; border: none; cursor: pointer;
      box-shadow: 0 6px 20px rgba(79,70,229,0.30); transition: all 0.2s ease;
    }
    .btn-home:hover { background: #4338CA; transform: translateY(-2px); box-shadow: 0 10px 28px rgba(79,70,229,0.38); }
    .btn-home:active { transform: translateY(0); }
    .footer-note { margin-top: 1.5rem; font-size: 12px; color: var(--gray-400); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">✦</div>
    <span class="code-badge">오류 404</span>
    <h1>페이지를 찾을 수 없어요</h1>
    <p class="sub">요청하신 주소의 페이지가 존재하지 않거나<br />이동되었을 수 있습니다.</p>
    <div class="card">
      <p class="hint">💡 다음 사항을 확인해 주세요</p>
      <ul class="checklist">
        <li>주소(URL)가 정확하게 입력되었는지 확인해 주세요.</li>
        <li>로그인 후 정상적인 메뉴를 통해 접근하시면 이용 가능합니다.</li>
        <li>북마크한 주소가 만료되었을 수 있습니다. 홈에서 다시 시작해 주세요.</li>
      </ul>
    </div>
    <a class="btn-home" href="/leave-management-server/">🏠 홈 화면으로 돌아가기</a>
    <p class="footer-note">스마트 연차관리 시스템 · 대한민국 근로기준법 제60조 준수</p>
  </div>
</body>
</html>
